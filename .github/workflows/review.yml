# AI による PR レビュー(plan/006、プレイブック Stage 5)。
# レビューするのは GitHub Actions 上の別の Claude。承認(マージ)するのは人間。
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  # PR が作られたり更新されたりしたら、REVIEW.md の観点でレビューする
  review:
    # このリポジトリのブランチからの PR だけ(他人のフォークからの PR では動かさない)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.event.pull_request.base.ref }}

            あなたはこの PR のレビュアーです。コードを書いた本人ではありません。
            まず REVIEW.md を読み、その観点と規則に厳密に従ってレビューしてください。
            CLAUDE.md、spec/life-dashboard.md、plan/ の該当する plan も、判断の根拠として読んでください。
            差分は `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD` で確認できます。
            結果は日本語で、`gh pr comment` で1つのコメントとして投稿してください。
            コードは変更しないでください。
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"

  # PR のコメントで「@claude」と頼まれたら、対応する(修正の push を含む)
  respond:
    # 公開リポジトリなので、リポジトリの持ち主のコメントにだけ反応する(他人に API キーを使わせない)
    if: |
      github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '@claude') && (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
        github.event_name == 'pull_request_review_comment'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
