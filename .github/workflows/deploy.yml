name: Deploy

on:
  push:
    branches: [claude/ai-native-sdlc-playbook-3yqzzp, main]
  workflow_dispatch:
    inputs:
      repair_initial_migrations:
        description: '手で適用済みの最初の2つのマイグレーションを「適用済み」として記録する(初回だけ)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # マイグレーションとサーバー側の関数を Supabase クラウドに適用する(plan/005 段階 A)
  supabase:
    needs: build
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Link project
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::GitHub の Secrets に SUPABASE_ACCESS_TOKEN と SUPABASE_DB_PASSWORD を登録してください"
            exit 1
          fi
          # プロジェクト ID は、公開用の URL(https://<ID>.supabase.co)から取り出す
          ref=$(echo "$SUPABASE_URL" | sed -E 's#https://([^.]+)\.supabase\.co.*#\1#')
          supabase link --project-ref "$ref"
      - name: Mark manually applied migrations
        if: ${{ inputs.repair_initial_migrations }}
        run: supabase migration repair --remote --yes --status applied 20261123000000 20261123010000
      - name: Apply migrations
        run: supabase db push --remote --yes
      - name: Deploy functions
        run: |
          if ls supabase/functions/*/index.ts >/dev/null 2>&1; then
            supabase functions deploy
          else
            echo "サーバー側の関数はまだありません"
          fi

  # 画面は、データベースの更新が終わってから配信する
  deploy:
    needs: [build, supabase]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
